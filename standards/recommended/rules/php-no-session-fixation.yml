            {
              "kind": "function_definition"
            },
            {
              "kind": "method_declaration"
            },
            {
              "kind": "program"
            }
          ],
          "all": [
            {
              "has": {
                "stopBy": "end",
                "regex": "(?i)password_verify\\s*\\(|\\$_(POST|REQUEST|GET)\\s*\\[\\s*['\"]\\w*pass"
              }
            },
            {
              "not": {
                "has": {
                  "stopBy": "end",
                  "regex": "^session_regenerate_id\\s*\\("
