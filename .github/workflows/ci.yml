name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, rust-analyzer
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # A real language server, so the type-query test runs instead of skipping.
      - run: npm install -g typescript-language-server@4 typescript@5
      # gopls for the Go type-query test (Go itself is on every hosted runner).
      - run: go install golang.org/x/tools/gopls@v0.24.0 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash
      - run: cargo test
      # larpcop enforces its own rules and keeps its generated agent files current
      - run: cargo run -- check
      - run: cargo run -- sync --check
