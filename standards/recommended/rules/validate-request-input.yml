{
  "id": "validate-request-input",
  "language": "TypeScript",
  "severity": "error",
  "message": "Request input used before it went through a schema validator.",
  "note": "Validate at the boundary and use only the result: `const input = Body.parse(req.body)` (zod, valibot, yup, joi...). Handlers then never see unvalidated data.",
  "rule": {
    "any": [
      {
        "pattern": "req.body"
      },
      {
        "pattern": "req.query"
      },
      {
        "pattern": "req.params"
      },
      {
        "pattern": "request.json()"
      },
      {
        "pattern": "request.formData()"
      },
      {
        "pattern": "request.nextUrl.searchParams"
      }
    ],
    "not": {
      "inside": {
        "stopBy": "end",
        "kind": "call_expression",
        "has": {
          "field": "function",
          "all": [
            {
              "regex": "\\.(parse|safeParse|parseAsync|safeParseAsync|validate|validateSync|validateAsync|assert|decode|cast)$"
            },
            {
              "not": {
                "regex": "^JSON\\."
              }
            }
          ]
        }
      }
    }
  }
}
