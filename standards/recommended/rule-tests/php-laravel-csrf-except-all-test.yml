id: php-laravel-csrf-except-all
file: app/Http/Middleware/VerifyCsrfToken.php
valid:
- "<?php\nclass VerifyCsrfToken extends Middleware {\n  protected $except = [\"stripe/webhook\"\
  , \"github/hook\"];\n}\n"
invalid:
