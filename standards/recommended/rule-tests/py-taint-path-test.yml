  from flask import Flask, request
  import pathlib
  app = Flask(__name__)

  @app.route('/x')
  def view():
      files = pathlib.Path('/srv/files')
      p = files / request.cookies.get('f', '')
      return 'yes' if p.exists() else 'no'
