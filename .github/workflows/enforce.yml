# Reusable workflow: the non-bypassable gate. Every repo calls it on pull requests
# (or an org ruleset requires it), so no agent and no human can merge violations.
#
#   jobs:
#     agentkit:
#       uses: NoahDuongMaster/agentkit/.github/workflows/enforce.yml@v0.1.0
#       with:
#         standards: https://github.com/<org>/standards.git#v1.0.0
#       secrets:
#         agentkit-token: ${{ secrets.AGENTKIT_TOKEN }}   # only while agentkit is private
name: agentkit-enforce

on:
  workflow_call:
    inputs:
      standards:
        description: Company standards forced on the repo (path or git URL#tag). Empty = repo config only.
        type: string
        default: ""
      agentkit-version:
        description: agentkit release tag. Empty = latest release.
        type: string
        default: ""
      comment:
        description: Post (and keep updating) one summary comment on the pull request. Needs `pull-requests write`.
        type: boolean
        default: true
      sarif:
        description: Upload SARIF to GitHub code scanning. Needs code scanning and `security-events write`.
        type: boolean
        default: false
      review:
        description: Run `agentkit review` (the repo's `llm` rules) and add its warnings to the PR comment. Never fails the job.
        type: boolean
        default: false
      review-setup:
        description: Shell command installing the model CLI on the runner.
        type: string
        default: npm install -g @anthropic-ai/claude-code
      review-command:
        description: Model CLI (prompt on stdin, answer on stdout). Empty = `llm.command` of the config, else `claude -p`.
        type: string
        default: ""
    secrets:
      agentkit-token:
        description: Token able to read agentkit releases and private standards (needed while they are private).
        required: false
      anthropic-api-key:
        description: For `review` with Claude Code.
        required: false
      openai-api-key:
        description: For `review` with Codex.
        required: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    env:
      AGENTKIT_EXTENDS: ${{ inputs.standards }}
      BASE_REF: ${{ github.base_ref }}
      GH_TOKEN: ${{ secrets.agentkit-token || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install agentkit
        env:
          VERSION: ${{ inputs.agentkit-version }}
        run: |
          gh release download ${VERSION:+"$VERSION"} --repo NoahDuongMaster/agentkit \
            --pattern 'agentkit-x86_64-unknown-linux-gnu.tar.xz' --output agentkit.tar.xz
          sudo tar -xJf agentkit.tar.xz --strip-components=1 -C /usr/local/bin
          rm agentkit.tar.xz
          agentkit --version

      - name: Allow fetching private standards
        if: env.GH_TOKEN != github.token
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      # Only files changed by the PR: legacy debt does not block, new debt cannot land.
      - name: Rules
        id: rules
        run: >-
          agentkit check --since "origin/${BASE_REF}" --format github
          --output markdown=agentkit-report.md --output sarif=agentkit.sarif

      # Advisory only: a model is not deterministic, so its findings never gate.
      - name: AI review
        if: always() && inputs.review && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          OPENAI_API_KEY: ${{ secrets.openai-api-key }}
          AGENTKIT_LLM: ${{ inputs.review-command }}
          SETUP: ${{ inputs.review-setup }}
        run: |
          if [ -n "$SETUP" ]; then sh -c "$SETUP"; fi
          agentkit review --since "origin/${BASE_REF}" --format markdown > agentkit-review.md
          if [ -f agentkit-report.md ]; then
            sed -i '1{/^<!-- agentkit-report -->$/d}' agentkit-review.md
            printf '\n' >> agentkit-report.md
          fi
          sed -i 's/^### agentkit$/### agentkit · AI review (advisory)/' agentkit-review.md
          cat agentkit-review.md >> agentkit-report.md

      # One comment per PR, edited on every push (never a pile of bot comments).
      - name: Pull request comment
        if: always() && inputs.comment && github.event_name == 'pull_request' && hashFiles('agentkit-report.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- agentkit-report -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@agentkit-report.md >/dev/null
          else
            gh pr comment "$PR" --body-file agentkit-report.md
          fi

      - name: Code scanning
        if: always() && inputs.sarif && hashFiles('agentkit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: agentkit.sarif
          category: agentkit

      - name: Generated agent files are current
        run: agentkit sync --check
