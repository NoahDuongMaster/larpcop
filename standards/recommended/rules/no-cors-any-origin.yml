            }
          }
        ]
      },
      {
        "kind": "call_expression",
        "all": [
          {
            "has": {
              "field": "function",
              "regex": "\\.(setHeader|header|set)$"
            }
          },
          {
            "has": {
              "field": "arguments",
              "regex": "Access-Control-Allow-Origin['\"]?\\s*,\\s*['\"]\\*"
            }
          }
        ]
      }
    ]
  },
  "ignores": [
