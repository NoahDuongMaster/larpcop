  - id: py-taint-code
    languages: [Python]
    message: Request data evaluated as code or deserialized into objects (code injection).
    note: Parse data with json.loads / ast.literal_eval and validate it; never eval, exec, pickle or yaml.load input.
    sources: ["request.args", "request.form", "request.values", "request.json", "request.files", "request.GET", "request.POST", "request.FILES", "request.query_params", "request.path_params", "request.headers", "request.cookies", "await request.post()", "await request.json()", "await request.form()", "await request.text()", "request.query", "request.match_info", "request.rel_url.query", "self.get_argument($$$A)", "self.get_query_argument($$$A)", "self.get_body_argument($$$A)"]
    sinks: ["eval($X, $$$R)", "exec($X, $$$R)", "pickle.loads($X)", "yaml.load($X, $$$R)", "marshal.loads($X)", "subprocess.$M($X, $$$R)", "os.system($X)", "os.popen($X, $$$R)"]
    sink_arg: X
    sanitizers: ["int($X)", "float($X)", "shlex.quote($X)", "ast.literal_eval($X)"]
    handler_decorators: '^\w+\.(get|post|put|patch|delete|route|api_route|websocket)\('
    resolver_args: true
    exclude: ["**/test/**", "**/tests/**", "**/__tests__/**", "**/spec/**", "**/*.test.*", "**/*.spec.*", "**/*_test.py", "**/test_*.py", "**/tests.py", "**/conftest.py", "**/*_test.go"]

  - id: taint-log
    languages: [TypeScript, Tsx, JavaScript]
    severity: warning
    message: Request data written to a log as is (log injection / forged log lines).
    note: Log a fixed message and pass the value as a structured field, or strip CR/LF first (value.replace(/[\r\n]/g, '')).
    sources: ["req.query", "req.body", "req.params", "req.headers", "req.cookies"]
    sinks: ["console.$M($$$A)", "$L.info($$$A)", "$L.warn($$$A)", "$L.error($$$A)", "$L.debug($$$A)", "$L.log($$$A)"]
    sanitizers: ["jwt.verify($$$A)", "+$X", "$S.replace($$$R)", "JSON.stringify($X)", "encodeURIComponent($X)", "Number($X)"]
    param_types: { Request: req }
    param_decorators: [Body, Query, Param, Headers, Req, Request, Cookies, UploadedFile, UploadedFiles]
    resolver_args: true
    exclude: ["**/test/**", "**/tests/**", "**/__tests__/**", "**/spec/**", "**/*.test.*", "**/*.spec.*", "**/*_test.py", "**/test_*.py", "**/tests.py", "**/conftest.py", "**/*_test.go"]

