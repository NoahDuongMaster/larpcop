# agentkit dogfoods itself: the example company standards (300-line limit and
# all) apply to this repo exactly as they would to any consumer repo.
extends:
  - examples/standards
exclude: ["examples/**", "target/**"]
secrets:
  # gitleaks' own config is full of sample patterns.
  exclude: ["assets/gitleaks.toml"]
dependencies:
  vulnerabilities: high
  # Approved for the dependency rules (deps.dev client, lockfile parsing).
  approved:
    - cargo:base64
    - cargo:cvss
    - cargo:jiff
    - cargo:lsp-server
    - cargo:lsp-types
    - cargo:percent-encoding
    - cargo:rmcp
    - cargo:tokio
    - cargo:toml
    - cargo:ureq
    - cargo:yarn-lock-parser
