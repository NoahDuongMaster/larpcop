  from flask import Flask, request
  import pathlib
  app = Flask(__name__)
  BASE = pathlib.Path('/srv/files').resolve()

  @app.route('/x')
  def view():
      p = (BASE / request.args['f']).resolve()
      if not p.is_relative_to(BASE):
          return 'no', 400
      return p.read_text()
