id: no-hardcoded-session-secret
valid:
  - "app.use(session({ secret: process.env.SESSION_SECRET, resave: false }));"
  - "const token = jwt.sign(payload, config.jwtSecret, { expiresIn: '1h' });"
  - "const opts = { secret: 'not a session' };"
invalid:
  - "app.use(session({ secret: 'keyboard cat', resave: false }));"
  - "const token = jwt.sign({ id }, 'shhhhh');"
  - "passport.use(new JwtStrategy({ secretOrKey: 'dev-secret', jwtFromRequest }, verify));"
