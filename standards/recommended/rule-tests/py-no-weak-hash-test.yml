id: py-no-weak-hash
valid:
- hashlib.sha256(data).hexdigest()
- hashlib.md5(data, usedforsecurity=False).hexdigest()
- hashlib.new('sha256', data)
- 'import hashlib

  ALG = "sha256"

  h = hashlib.new(ALG, data)

  '
invalid:
- hashlib.md5(password.encode()).hexdigest()
- hashlib.sha1(data)
- hashlib.new('md5', data)
- ok = self.pwd_hash == md5(password.encode('utf-8')).hexdigest()
- 'import hashlib

  ALG = "md5"

  h = hashlib.new(ALG, data)

  '
