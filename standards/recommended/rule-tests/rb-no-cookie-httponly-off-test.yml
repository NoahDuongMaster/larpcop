id: rb-no-cookie-httponly-off
file: config/initializers/session_store.rb
valid:
- 'Rails.application.config.session_store :cookie_store, key: "_app_session"'
- 'cookies[:t] = { value: v, httponly: true, secure: true }'
invalid:
- 'Rails.application.config.session_store :cookie_store, key: "_app_session", httponly: false'
- 'cookies[:t] = { value: v, :secure => false }'
