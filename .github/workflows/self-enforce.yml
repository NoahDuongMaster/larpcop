# Dogfood: larpcop's own pull requests go through the same gate consumers use,
# with the example company standards forced on top of the repo config.
name: self-enforce

on:
  pull_request:

jobs:
  larpcop:
    permissions:
      contents: read
      pull-requests: write   # the sticky PR comment
    uses: ./.github/workflows/enforce.yml
    with:
      standards: examples/standards
      # Run the code in this PR, not the last release: a change to a generated
      # file (the AGENTS.md template, say) and to the code that writes it must
      # pass together.
      larpcop-from-source: true
