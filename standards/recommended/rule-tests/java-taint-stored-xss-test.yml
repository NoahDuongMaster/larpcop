  @RestController
  public class PostController {
    private final PostRepository postRepository;
    PostController(PostRepository postRepository) { this.postRepository = postRepository; }
    @GetMapping("/posts")
    public String posts(@RequestParam String level) {
      StringBuilder out = new StringBuilder();
      this.postRepository.findByLevel(level).forEach(p -> out.append("<div>" + p.getContent() + "</div>"));
      return out.toString();
    }
  }
