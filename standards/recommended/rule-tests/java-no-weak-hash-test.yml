- "class H {\n  byte[] h(byte[] in, java.util.Properties props) throws Exception {\n    String algorithm = props.getProperty(\"hashAlg\", \"SHA-256\");\n    return MessageDigest.getInstance(algorithm).digest(in);\n\
  \  }\n}\n"
- "class H {\n  byte[] h(byte[] in, String algorithm) throws Exception {\n    return MessageDigest.getInstance(algorithm).digest(in);\n  }\n}\n"
- "class H {\n  byte[] h(byte[] in) throws Exception {\n    String algorithm = \"MD5\";\n    algorithm = \"SHA-256\";\n    return MessageDigest.getInstance(algorithm).digest(in);\n  }\n}\n"
