# Reusable workflow: the non-bypassable gate. Every repo calls it on pull requests
# (or an org ruleset requires it), so no agent and no human can merge violations.
#
#   jobs:
#     larpcop:
#       uses: NoahDuongMaster/larpcop/.github/workflows/enforce.yml@v0.2.0
#       with:
#         standards: https://github.com/<org>/standards.git#v1.0.0
#       secrets:
#         larpcop-token: ${{ secrets.LARPCOP_TOKEN }}   # only while larpcop is private
name: larpcop-enforce

on:
  workflow_call:
    inputs:
      standards:
        description: Company standards forced on the repo (path or git URL#tag). Empty = repo config only.
        type: string
        default: ""
      larpcop-version:
        description: larpcop release tag. Empty = latest release.
        type: string
        default: ""
      comment:
        description: Post (and keep updating) one summary comment on the pull request. Needs `pull-requests write`.
        type: boolean
        default: true
      sarif:
        description: Upload SARIF to GitHub code scanning. Needs code scanning and `security-events write`.
        type: boolean
        default: false
      review:
        description: Run `larpcop review` (the repo's `llm` rules) and add its warnings to the PR comment. Never fails the job.
        type: boolean
        default: false
      review-setup:
        description: Shell command installing the model CLI on the runner.
        type: string
        default: npm install -g @anthropic-ai/claude-code
      review-command:
        description: Model CLI (prompt on stdin, answer on stdout). Empty = `llm.command` of the config, else `claude -p`.
        type: string
        default: ""
    secrets:
      larpcop-token:
        description: Token able to read larpcop releases and private standards (needed while they are private).
        required: false
      anthropic-api-key:
        description: For `review` with Claude Code.
        required: false
      openai-api-key:
        description: For `review` with Codex.
        required: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    env:
      LARPCOP_EXTENDS: ${{ inputs.standards }}
      BASE_REF: ${{ github.base_ref }}
      GH_TOKEN: ${{ secrets.larpcop-token || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install larpcop
        env:
          VERSION: ${{ inputs.larpcop-version }}
        run: |
          gh release download ${VERSION:+"$VERSION"} --repo NoahDuongMaster/larpcop \
            --pattern 'larpcop-x86_64-unknown-linux-gnu.tar.xz' --output larpcop.tar.xz
          sudo tar -xJf larpcop.tar.xz --strip-components=1 -C /usr/local/bin
          rm larpcop.tar.xz
          larpcop --version

      - name: Allow fetching private standards
        if: env.GH_TOKEN != github.token
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      # Only files changed by the PR: legacy debt does not block, new debt cannot land.
      - name: Rules
        id: rules
        run: >-
          larpcop check --since "origin/${BASE_REF}" --format github
          --output markdown=larpcop-report.md --output sarif=larpcop.sarif

      # Advisory only: a model is not deterministic, so its findings never gate.
      - name: AI review
        if: always() && inputs.review && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          OPENAI_API_KEY: ${{ secrets.openai-api-key }}
          LARPCOP_LLM: ${{ inputs.review-command }}
          SETUP: ${{ inputs.review-setup }}
        run: |
          if [ -n "$SETUP" ]; then sh -c "$SETUP"; fi
          larpcop review --since "origin/${BASE_REF}" --format markdown > larpcop-review.md
          if [ -f larpcop-report.md ]; then
            sed -i '1{/^<!-- larpcop-report -->$/d}' larpcop-review.md
            printf '\n' >> larpcop-report.md
          fi
          sed -i 's/^### larpcop$/### larpcop · AI review (advisory)/' larpcop-review.md
          cat larpcop-review.md >> larpcop-report.md

      # One comment per PR, edited on every push (never a pile of bot comments).
      - name: Pull request comment
        if: always() && inputs.comment && github.event_name == 'pull_request' && hashFiles('larpcop-report.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- larpcop-report -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@larpcop-report.md >/dev/null
          else
            gh pr comment "$PR" --body-file larpcop-report.md
          fi

      - name: Code scanning
        if: always() && inputs.sarif && hashFiles('larpcop.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: larpcop.sarif
          category: larpcop

      - name: Generated agent files are current
        run: larpcop sync --check
