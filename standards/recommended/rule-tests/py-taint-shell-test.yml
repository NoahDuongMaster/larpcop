  from flask import Flask, request
  import os, subprocess
  app = Flask(__name__)

  @app.route('/x')
  def view():
      name = request.args['name']
      args = []
      if 'Windows' in os.name:
          args.append('cmd.exe')
          args.append('/c')
      else:
          args.append('/bin/bash')
          args.append('-lc')
      args.append(f'echo {name}')
      subprocess.run(args, capture_output=True)
