{
  "id": "no-hardcoded-session-secret",
  "language": "TypeScript",
  "severity": "error",
  "message": "Session / token signing secret hard-coded in the source.",
  "note": "Read it from the environment or a secret manager (process.env.SESSION_SECRET); anyone with the code can forge sessions.",
  "rule": {
    "any": [
      {
        "kind": "pair",
        "all": [
          {
            "has": {
              "field": "key",
              "regex": "^['\"]?(secret|secretOrKey|secretOrPublicKey|jwtSecret|cookieSecret)['\"]?$"
            }
          },
          {
            "has": {
              "field": "value",
              "kind": "string"
            }
          },
          {
            "inside": {
              "stopBy": "end",
              "any": [
                {
                  "kind": "call_expression",
                  "has": {
                    "field": "function",
                    "regex": "(^|\\.)(session|expressSession|cookieSession|Strategy|JwtStrategy|expressjwt|expressJwt|jwt|koaSession)$"
                  }
                },
                {
                  "kind": "new_expression",
                  "has": {
                    "field": "constructor",
                    "regex": "(^|\\.)(session|expressSession|cookieSession|Strategy|JwtStrategy|expressjwt|expressJwt|jwt|koaSession)$"
                  }
                }
              ]
            }
          }
        ]
      },
      {
        "kind": "call_expression",
        "all": [
          {
            "has": {
              "field": "function",
              "regex": "^(jwt|jsonwebtoken|JWT|jose)\\.(sign|verify)$"
            }
          },
          {
            "has": {
              "field": "arguments",
              "has": {
                "nthChild": 2,
                "kind": "string"
              }
            }
          }
        ]
      }
    ]
  },
  "ignores": [
    "**/test/**",
    "**/tests/**",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*"
  ]
}
