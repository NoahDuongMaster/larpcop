- "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<mapper namespace=\"a.UserMapper\">\n  <select id=\"byName\" resultType=\"User\">select * from users where name = '${name}'</select>\n</mapper>\n"
- "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<mapper namespace=\"a.UserMapper\">\n  <select id=\"list\" resultType=\"User\">\n    select * from users order by ${column}\n  </select>\n</mapper>\n"
- "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<mapper namespace=\"a.UserMapper\">\n  <select id=\"find\">select * from users where name like '%${q}%'</select>\n</mapper>\n"
