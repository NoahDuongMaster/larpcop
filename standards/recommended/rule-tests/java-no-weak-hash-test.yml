id: java-no-weak-hash
valid:
- "class T {\n  void f(String name, int id) throws Exception {\n    MessageDigest.getInstance(\"SHA-256\");\n  }\n}\n"
invalid:
- "class T {\n  void f(String name, int id) throws Exception {\n    MessageDigest md = MessageDigest.getInstance(\"MD5\");\n  }\n}\n"
- "class T {\n  void f(String name, int id) throws Exception {\n    java.security.MessageDigest.getInstance(\"SHA1\");\n  }\n}\n"
