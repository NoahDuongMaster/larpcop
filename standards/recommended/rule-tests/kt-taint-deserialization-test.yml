id: kt-taint-deserialization
valid:
- "@RestController\nclass C(private val jdbc: JdbcTemplate) {\n    @GetMapping(\"/x\")\n    fun x(@RequestParam q: String, request: HttpServletRequest, response: HttpServletResponse, ctx: DirContext): String\
  \ {\n        Yaml(SafeConstructor(LoaderOptions())).load<Any>(q)\n        return \"ok\"\n    }\n}\n"
- "@RestController\nclass C(private val jdbc: JdbcTemplate) {\n    @GetMapping(\"/x\")\n    fun x(@RequestParam q: String, request: HttpServletRequest, response: HttpServletResponse, ctx: DirContext): String\
  \ {\n        ObjectMapper().readValue(q, User::class.java)\n        return \"ok\"\n    }\n}\n"
invalid:
- "@RestController\nclass C(private val jdbc: JdbcTemplate) {\n    @GetMapping(\"/x\")\n    fun x(@RequestParam q: String, request: HttpServletRequest, response: HttpServletResponse, ctx: DirContext): String\
  \ {\n        ObjectInputStream(request.inputStream).readObject()\n        return \"ok\"\n    }\n}\n"
- "@RestController\nclass C(private val jdbc: JdbcTemplate) {\n    @GetMapping(\"/x\")\n    fun x(@RequestParam q: String, request: HttpServletRequest, response: HttpServletResponse, ctx: DirContext): String\
  \ {\n        Yaml().load<Any>(q)\n        return \"ok\"\n    }\n}\n"
