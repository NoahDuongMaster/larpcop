[package]
name = "agentkit"
version = "0.1.0"
edition = "2024"
description = "Agent-agnostic coding-rule enforcement: one binary, every agent, every stack."
repository = "https://github.com/NoahDuongMaster/agentkit"
homepage = "https://github.com/NoahDuongMaster/agentkit"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
ast-grep-config = "0.51"
ast-grep-core = "0.51"
ast-grep-language = "0.51"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
cvss = "3"
dirs = "7.0.0"
dunce = "1.0.5"
globset = "0.4.21"
ignore = "0.4.34"
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
jsonc-parser = { version = "=0.34.0", features = ["serde"] }
lsp-server = "0.10"
lsp-types = "0.97"
percent-encoding = "2.3.2"
rayon = "1.12.0"
regex = "1.13.1"
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
tokio = { version = "1.53", default-features = false, features = ["rt"] }
toml = "1.1.8"
ureq = "3.4"
yarn-lock-parser = "0.14.0"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

# The profile that 'dist' will build with: identical to release (full LTO).
[profile.dist]
inherits = "release"
