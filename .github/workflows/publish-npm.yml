# Publishes the npm package that dist builds for a release (larpcop-npm-package.tar.gz)
# to npmjs.com as `larpcop`, with trusted publishing (OIDC, no stored token). npm
# checks the name of the calling workflow, so the trusted publisher is set up for
# `release.yml`, which calls this file (see `publish-jobs` in dist-workspace.toml).
name: publish-npm

on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan (JSON), passed by release.yml
        required: true
        type: string

# release.yml grants this call `id-token` and `packages`, and a called workflow
# cannot ask for more than its caller. Only `id-token` is used here.
permissions: {}

jobs:
  npmjs:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download the package from the release
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          TAG=$(jq -r .announcement_tag <<<"$PLAN")
          case "$TAG" in v[0-9]*) ;; *) echo "::error::not a release tag: '$TAG'"; exit 1 ;; esac
          curl -fsSL --retry 3 -o larpcop-npm-package.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/larpcop-npm-package.tar.gz"
          tar -tzf larpcop-npm-package.tar.gz | head -3

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm --version
      - run: npm publish ./larpcop-npm-package.tar.gz --access public
